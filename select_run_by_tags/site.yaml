- hosts: webservers
  become: true
  vars:
    app_name: Hexlet
    root_dir: /var/www/hexlet
    nginx_port: 80
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: latest
      tags: packages

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
      tags: packages

    - name: Create site directory
      ansible.builtin.file:
        path: "{{ root_dir }}"
        state: directory
        mode: "0755"
      tags: config

    - name: Write site page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ root_dir }}/index.html"
        mode: "0644"
      tags: config

    - name: Write nginx config
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
      notify:
        - Reload nginx config
      tags: config

    - ansible.builtin.meta: flush_handlers
    - ansible.builtin.debug:
        msg: "Reloading config"

  handlers:
    - name: Reload nginx config
      ansible.builtin.service:
        name: nginx
        state: restarted
